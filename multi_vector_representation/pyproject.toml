[project]
name = "multi-vector-representation"
version = "0.0.1"
description = "ColBERT multi-vector search experiment for Decide"
authors = [{ name = "Adam McCabe" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "torch>=2.13.0,<3",
    "transformers>=5.0.0,<6",
    "sentence-transformers>=5.0.0,<6",
    "numpy>=2.3.3,<3",
    "pandas>=2.3.3,<3",
    "scikit-learn>=1.7.0,<2",
    "asyncpg>=0.30.0,<0.32",
    "pydantic>=2.12.3,<3",
    "tqdm>=4.67.1",
    "einops>=0.8.1,<0.9",
    "anthropic>=0.71.0,<0.72",
    "openai>=1.1.0,<2.0.0",
    "python-dotenv>=1.2.2,<2",
    "instructor>=1.11.3,<2",
    "fastapi>=0.116.0,<1",
    "uvicorn>=0.37.0,<1",
    "jinja2>=3.1.0,<4",
    "scipy>=1.14.0,<2",
    "httpx>=0.28.1,<0.29",
    "matplotlib>=3.10.0,<4",
]

[dependency-groups]
dev = [
    # Removed jupyter/notebook - not needed (no .ipynb files in project)
    # and it brings in nbconvert with CVE-2025-53000 (unpatched)
    "ipython>=9.6.0,<10",
]
