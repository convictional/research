[project]
name = "gpt-oss-trial"
version = "0.0.1"
description = "Trial of GPT OSS model and the managed Vertex endpoint."
authors = [{ name = "Adam McCabe" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "numpy>=2.3.3,<3",
    "pandas>=2.3.3,<3",
    "asyncpg>=0.30.0,<0.32",
    "pydantic>=2.12.3,<3",
    "tqdm>=4.67.1",
    "anthropic>=0.71.0,<0.72",
    "python-dotenv>=1.2.2,<2",
    "instructor>=1.11.3,<2",
    "jinja2>=3.1.0,<4",
    "httpx>=0.28.1",
    "tiktoken>=0.12.0",
]

[dependency-groups]
development = [
    "ruff>=0.11.12,<0.12",
    "pre-commit>=4.2.0,<5",
]

[tool.uv]
package = false
default-groups = ["development"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 119
