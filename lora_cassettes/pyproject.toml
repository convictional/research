[project]
name = "lora-cassettes"
version = "0.0.1"
description = "Episodic LoRA adapters for encoder retrieval models."
authors = [{ name = "Adam McCabe" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "torch>=2.13.0,<3",
    "transformers>=5.0.0,<6",
    "sentence-transformers>=5.0.0,<6",
    "numpy>=2.3.3,<3",
    "pandas>=2.3.3,<3",
    "scikit-learn>=1.7.0,<2",
    "asyncpg>=0.30.0,<0.32",
    "pydantic>=2.12.3,<3",
    "tqdm>=4.67.1",
    "anthropic>=0.71.0,<0.72",
    "openai>=1.1.0,<2.0.0",
    "python-dotenv>=1.2.2,<2",
    "instructor>=1.11.3,<2",
    "jinja2>=3.1.0,<4",
    "scipy>=1.14.0,<2",
    "matplotlib>=3.10.0,<4",
    "peft>=0.17.1",
    "psutil>=7.1.3",
]


[dependency-groups]
development = [
    "ruff>=0.11.12,<0.12",
    "pre-commit>=4.2.0,<5",
]

[tool.uv]
package = false
default-groups = ["development"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 119
